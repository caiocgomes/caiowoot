<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaioWoot · Arquitetura</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper:       #faf7f2;
      --paper-2:     #f2ede4;
      --ink:         #1c1917;
      --muted:       #57534e;
      --soft:        #78716c;
      --rule:        rgba(28,25,23,0.12);
      --accent:      #b5523a;
      --accent-tint: rgba(181,82,58,0.08);
      --link:        #2563eb;
      --font-sans:   'Geist', system-ui, sans-serif;
      --font-serif:  'Instrument Serif', serif;
      --font-mono:   'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--ink);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 1.75rem;
      max-width: 640px;
      line-height: 1.45;
    }

    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · CaioWoot</p>
    <h1>Copiloto de vendas WhatsApp</h1>
    <p class="subtitle">Webhook recebe mensagem da Evolution, roteia para qualifying (lead novo) ou gera três variações paralelas via Haiku. Operador edita e envia; o par edição vira few-shot para o próximo draft.</p>

    <svg viewBox="0 0 1080 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arquitetura CaioWoot">
      <defs>
        <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#57534e"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#b5523a"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
        </marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="rgba(28,25,23,0.35)"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#faf7f2"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- ============================================ -->
      <!-- Arrows first (behind boxes)                 -->
      <!-- ============================================ -->

      <!-- 1. Evolution (in) → Webhook (LINK) -->
      <line x1="120" y1="144" x2="120" y2="240" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- 2. Webhook → Auto-qualifier (dashed muted — conditional) -->
      <path d="M 200 256 Q 240 200 280 192" fill="none" stroke="#57534e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- 3. Webhook → Draft engine (ACCENT — primary) -->
      <line x1="200" y1="288" x2="280" y2="292" stroke="#b5523a" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- 4. Auto-qualifier → Claude Haiku (LINK) -->
      <line x1="480" y1="192" x2="560" y2="220" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- 5. Draft engine → Claude Haiku (ACCENT — 3x parallel) -->
      <line x1="480" y1="288" x2="560" y2="248" stroke="#b5523a" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- 6. Draft engine → ChromaDB (muted — few-shot read) -->
      <path d="M 460 324 Q 520 360 560 396" fill="none" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 7. Draft engine → SQLite (muted — write drafts) -->
      <line x1="380" y1="324" x2="380" y2="380" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 8. Draft engine → Operator PWA (muted, arco — WS broadcast) -->
      <path d="M 480 272 Q 640 168 800 272" fill="none" stroke="#57534e" stroke-width="1.1" marker-end="url(#arrow)"/>

      <!-- 9. Operator PWA → SQLite (muted, arco — edit + send) -->
      <path d="M 820 304 Q 640 424 480 412" fill="none" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- 10. SQLite → ChromaDB (dashed — async index) -->
      <line x1="480" y1="412" x2="560" y2="412" stroke="rgba(28,25,23,0.35)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>

      <!-- 11. Background cron → SQLite (muted — scheduled sends) -->
      <line x1="200" y1="412" x2="280" y2="412" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- ============================================ -->
      <!-- Arrow labels (always with opaque mask)      -->
      <!-- ============================================ -->

      <rect x="96" y="184" width="48" height="12" rx="2" fill="#faf7f2"/>
      <text x="120" y="193" fill="#2563eb" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEBHOOK</text>

      <rect x="212" y="216" width="64" height="12" rx="2" fill="#faf7f2"/>
      <text x="244" y="225" fill="#57534e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LEAD NOVO</text>

      <rect x="212" y="276" width="64" height="12" rx="2" fill="#faf7f2"/>
      <text x="244" y="285" fill="#b5523a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QUALIFICADO</text>

      <rect x="496" y="192" width="48" height="12" rx="2" fill="#faf7f2"/>
      <text x="520" y="201" fill="#2563eb" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HAIKU</text>

      <rect x="496" y="256" width="56" height="12" rx="2" fill="#faf7f2"/>
      <text x="524" y="265" fill="#b5523a" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">3× HAIKU</text>

      <rect x="480" y="348" width="64" height="12" rx="2" fill="#faf7f2"/>
      <text x="512" y="357" fill="#57534e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FEW-SHOT</text>

      <rect x="344" y="344" width="72" height="12" rx="2" fill="#faf7f2"/>
      <text x="380" y="353" fill="#57534e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WRITE DRAFTS</text>

      <rect x="604" y="196" width="72" height="12" rx="2" fill="#faf7f2"/>
      <text x="640" y="205" fill="#57534e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WS BROADCAST</text>

      <rect x="604" y="400" width="72" height="12" rx="2" fill="#faf7f2"/>
      <text x="640" y="409" fill="#57534e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDIT + SEND</text>

      <rect x="492" y="400" width="40" height="12" rx="2" fill="#faf7f2"/>
      <text x="512" y="409" fill="#78716c" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INDEX</text>

      <rect x="212" y="400" width="64" height="12" rx="2" fill="#faf7f2"/>
      <text x="244" y="409" fill="#57534e" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENQUEUE</text>

      <!-- ============================================ -->
      <!-- Nodes (drawn on top)                         -->
      <!-- ============================================ -->

      <!-- 1. Evolution API (external input) -->
      <rect x="40" y="80" width="160" height="64" rx="6" fill="#faf7f2"/>
      <rect x="40" y="80" width="160" height="64" rx="6" fill="rgba(87,83,78,0.10)" stroke="#78716c" stroke-width="1"/>
      <rect x="48" y="88" width="32" height="12" rx="2" fill="transparent" stroke="rgba(120,113,108,0.50)" stroke-width="0.8"/>
      <text x="64" y="97" fill="#78716c" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="120" y="116" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Evolution API</text>
      <text x="120" y="132" fill="#57534e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">WhatsApp · webhook</text>

      <!-- 2. Webhook router (backend) -->
      <rect x="40" y="240" width="160" height="64" rx="6" fill="#faf7f2"/>
      <rect x="40" y="240" width="160" height="64" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <rect x="48" y="248" width="40" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="68" y="257" fill="#1c1917" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROUTE</text>
      <text x="120" y="276" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Webhook</text>
      <text x="120" y="292" fill="#57534e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dedup + is_qualified</text>

      <!-- 3. Auto-qualifier (backend) -->
      <rect x="280" y="160" width="200" height="64" rx="6" fill="#faf7f2"/>
      <rect x="280" y="160" width="200" height="64" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
      <rect x="288" y="168" width="40" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="308" y="177" fill="#1c1917" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BOT</text>
      <text x="380" y="196" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Qualifying Bot</text>
      <text x="380" y="212" fill="#57534e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">QUALIFY_TOOL · handoff</text>

      <!-- 4. Draft engine (FOCAL — accent) -->
      <rect x="280" y="260" width="200" height="64" rx="6" fill="#faf7f2"/>
      <rect x="280" y="260" width="200" height="64" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1.2"/>
      <rect x="288" y="268" width="48" height="12" rx="2" fill="transparent" stroke="rgba(181,82,58,0.55)" stroke-width="0.8"/>
      <text x="312" y="277" fill="#b5523a" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="472" y="320" fill="rgba(181,82,58,0.14)" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">01</text>
      <text x="380" y="296" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Draft Engine</text>
      <text x="380" y="312" fill="#57534e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3 variações · prompt_builder</text>

      <!-- 5. Claude Haiku (external LLM) -->
      <rect x="560" y="180" width="160" height="64" rx="6" fill="#faf7f2"/>
      <rect x="560" y="180" width="160" height="64" rx="6" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
      <rect x="568" y="188" width="32" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.30)" stroke-width="0.8"/>
      <text x="584" y="197" fill="#57534e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="640" y="216" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Claude Haiku</text>
      <text x="640" y="232" fill="#57534e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Anthropic · DRAFT_TOOL</text>

      <!-- 6. Operator PWA (external output) -->
      <rect x="800" y="240" width="200" height="64" rx="6" fill="#faf7f2"/>
      <rect x="800" y="240" width="200" height="64" rx="6" fill="rgba(87,83,78,0.10)" stroke="#78716c" stroke-width="1"/>
      <rect x="808" y="248" width="40" height="12" rx="2" fill="transparent" stroke="rgba(120,113,108,0.50)" stroke-width="0.8"/>
      <text x="828" y="257" fill="#78716c" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
      <text x="900" y="276" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Operator PWA</text>
      <text x="900" y="292" fill="#57534e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vanilla JS · /ws</text>

      <!-- 7. Background cron (backend) -->
      <rect x="40" y="380" width="160" height="64" rx="6" fill="#faf7f2"/>
      <rect x="40" y="380" width="160" height="64" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1" stroke-dasharray="5,3"/>
      <rect x="48" y="388" width="40" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
      <text x="68" y="397" fill="#1c1917" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CRON</text>
      <text x="120" y="416" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Background Jobs</text>
      <text x="120" y="432" fill="#57534e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">scheduler · rewarm · cold</text>

      <!-- 8. SQLite WAL (store) -->
      <rect x="280" y="380" width="200" height="64" rx="6" fill="#faf7f2"/>
      <rect x="280" y="380" width="200" height="64" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
      <rect x="288" y="388" width="40" height="12" rx="2" fill="transparent" stroke="rgba(87,83,78,0.50)" stroke-width="0.8"/>
      <text x="308" y="397" fill="#57534e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="380" y="416" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SQLite WAL</text>
      <text x="380" y="432" fill="#57534e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">conversations · drafts · edits</text>

      <!-- 9. ChromaDB (store) -->
      <rect x="560" y="380" width="200" height="64" rx="6" fill="#faf7f2"/>
      <rect x="560" y="380" width="200" height="64" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
      <rect x="568" y="388" width="40" height="12" rx="2" fill="transparent" stroke="rgba(87,83,78,0.50)" stroke-width="0.8"/>
      <text x="588" y="397" fill="#57534e" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VECTOR</text>
      <text x="660" y="416" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ChromaDB + Rules</text>
      <text x="660" y="432" fill="#57534e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">edit_pairs · learned_rules</text>

      <!-- ============================================ -->
      <!-- Legend strip                                 -->
      <!-- ============================================ -->
      <line x1="40" y1="484" x2="1040" y2="484" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>
      <text x="40" y="500" fill="#57534e" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="516" width="14" height="10" rx="2" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1.2"/>
      <text x="60" y="524" fill="#57534e" font-size="8.5" font-family="'Geist', sans-serif">Núcleo (draft engine)</text>

      <rect x="200" y="516" width="14" height="10" rx="2" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>

      <rect x="344" y="516" width="14" height="10" rx="2" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>

      <rect x="420" y="516" width="14" height="10" rx="2" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.30)" stroke-width="1"/>
      <text x="440" y="524" fill="#57534e" font-size="8.5" font-family="'Geist', sans-serif">LLM externo</text>

      <rect x="516" y="516" width="14" height="10" rx="2" fill="rgba(87,83,78,0.10)" stroke="#78716c" stroke-width="1"/>
      <text x="536" y="524" fill="#57534e" font-size="8.5" font-family="'Geist', sans-serif">Externo / cliente</text>

      <line x1="628" y1="522" x2="660" y2="522" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow-link)"/>

    </svg>
  </div>
</body>
</html>
